<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TFT Set 18 Items | MokaTroy TFT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/extras.css">
  <link rel="stylesheet" href="css/tooltip.css">
  <meta name="theme-color" content="#0a0d18">
</head>
<body>
  <div class="ambient orb-a"></div>
  <div class="ambient orb-b"></div>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MokaTroy <em>TFT</em></span></a>
    <nav>
      <a href="index.html" data-i18n="navHome">الرئيسية</a>
      <a href="comps.html" data-i18n="navComps">التشكيلات</a>
      <a href="augments.html" data-i18n="navAugments">الأوجمنتس</a>
      <a href="champions.html" data-i18n="navChampions">التشامبيونز</a>
      <a class="active" href="items.html" data-i18n="navItems">الأيتمز</a>
      <a href="traits.html" data-i18n="navTraits">التريتس</a>
      <a href="patch.html" data-i18n="navPatch">الباتش</a>
    </nav>
    <button class="lang-toggle" type="button" aria-label="Change language">EN</button>
  </header>

  <main class="page-main">
    <p class="eyebrow">SET 18</p>
    <h1 class="page-title" data-i18n="itemsTitle">ترتيب الأيتمز</h1>
    <p class="page-subtitle" data-i18n="itemsSubtitle">ترتيب الأيتمز حسب قوتها في الميتا الحالية.</p>

    <!-- الفرن / Item Oven -->
    <section id="oven-root" class="oven-section" aria-label="Item oven">
      <div class="oven-header">
        <div>
          <h2 class="oven-title" data-i18n="ovenTitle">الفرن</h2>
          <p class="oven-sub" data-i18n="ovenSubtitle">اختار كومبوننتين وشوف الأيتم الكاملة</p>
        </div>
        <button type="button" id="oven-clear" class="oven-clear-btn" data-i18n="ovenClear">مسح</button>
      </div>

      <div class="oven-workspace">
        <div class="oven-left">
          <div id="oven-slots" class="oven-slots"></div>
          <div class="oven-arrow" aria-hidden="true">→</div>
          <div id="oven-result" class="oven-result"></div>
        </div>
        <div class="oven-right">
          <p class="oven-comp-label" data-i18n="ovenComponents">الكومبوننتس</p>
          <div id="oven-components" class="oven-components"></div>
        </div>
      </div>
    </section>

    <div class="tier-toolbar">
      <input id="tier-search" class="tier-search" data-i18n-placeholder="itemsSearch" placeholder="ابحث عن أيتم…">
    </div>
    <div id="tier-board" class="tier-board"></div>
  </main>

  <footer><span>© 2026 MokaTroy TFT</span></footer>
  <script type="module" src="js/tierlist.js"></script>
  <script type="module" src="js/oven.js"></script>
  <script type="module" src="js/tooltip.js"></script>
</body>
</html>
