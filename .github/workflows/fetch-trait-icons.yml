name: Fetch trait icons

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download trait icons
        run: python3 scripts/fetch-trait-icons.py
      - name: Commit assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "assets: refresh Set 18 trait icons"
          file_pattern: "assets/traits/*.png"
