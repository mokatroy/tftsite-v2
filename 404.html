(function(){
  var p=location.pathname;
  var m=p.match(/\/(en|ja)(?=\/|$)/);
  if(!m) return;
  var rest=p.replace(/\/(en|ja)(?=\/|$)/,'')||'/';
  if(rest.endsWith('/')) rest+='index.html';
  else if(!/\.[a-z0-9]+$/i.test(rest)) rest+='.html';
  var q=new URLSearchParams(location.search);
  q.set('lang', m[1]);
  location.replace(rest+'?'+q.toString()+location.hash);
})();
