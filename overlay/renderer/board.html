<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الوحدات النهائية</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{margin:0;background:transparent}
    .board-shell{
      margin:10px;border-radius:18px;overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(165deg,rgba(16,20,34,.96),rgba(8,10,18,.94));
      box-shadow:0 18px 50px rgba(0,0,0,.45);
      -webkit-app-region:drag;
    }
    .board-top{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);
    }
    .board-top h1{margin:0;font:800 15px Outfit,Cairo,sans-serif;color:#f6f1e8}
    .board-top .tier{color:#e9b964;font-size:11px;font-weight:800}
    .board-actions{-webkit-app-region:no-drag;display:flex;gap:8px}
    .board-actions button{
      border:0;border-radius:8px;padding:7px 11px;cursor:pointer;
      font:800 12px Arial,"Cairo",sans-serif;
    }
    .btn-back{background:#e9b964;color:#1a1408}
    .btn-close{background:rgba(255,255,255,.08);color:#dfe3ec}
    .board-body{padding:12px 14px 16px;-webkit-app-region:no-drag}
    .board-body h2{margin:0 0 8px;font-size:12px;color:#aeb6c8}
    .board-body .section{margin-top:14px}
  </style>
</head>
<body>
  <main class="board-shell">
    <header class="board-top">
      <div>
        <div class="tier" id="board-tier"></div>
        <h1 id="board-title">…</h1>
      </div>
      <div class="board-actions">
        <button type="button" class="btn-back" id="back-main">اختيار كومب آخر</button>
        <button type="button" class="btn-close" id="close-board">×</button>
      </div>
    </header>
    <div class="board-body">
      <section>
        <h2>توزيع البورد</h2>
        <div id="board-mount"></div>
      </section>
      <section class="section">
        <h2>الوحدات النهائية</h2>
        <div class="units" id="units-mount"></div>
      </section>
    </div>
  </main>
  <script src="board.js"></script>
</body>
</html>
