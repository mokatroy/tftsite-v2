<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الوحدات النهائية</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html,body{margin:0;padding:0;background:transparent;overflow:hidden}
    .strip{
      margin:6px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(90deg,rgba(14,18,30,.96),rgba(10,12,22,.94));
      box-shadow:0 12px 32px rgba(0,0,0,.4);
      -webkit-app-region:drag;
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:72px;
    }
    .strip-meta{flex:0 0 auto;max-width:140px}
    .strip-meta .tier{color:#e9b964;font:800 10px Arial,"Cairo",sans-serif;margin:0 0 2px}
    .strip-meta h1{margin:0;font:800 13px Outfit,Cairo,sans-serif;color:#f6f1e8;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .strip-units{
      flex:1 1 auto;
      display:flex;flex-wrap:nowrap;gap:6px;align-items:center;
      overflow-x:auto;overflow-y:hidden;
      -webkit-app-region:no-drag;
      padding:2px 0;
    }
    .strip-units .unit-chip{
      flex:0 0 auto;
      padding:4px 8px 4px 4px;
      gap:6px;
      background:rgba(255,255,255,.06);
    }
    .strip-units .unit-avatar{width:32px;height:32px;border-radius:8px}
    .strip-units .unit-label{font-size:11px;white-space:nowrap}
    .strip-actions{-webkit-app-region:no-drag;display:flex;gap:6px;flex:0 0 auto}
    .strip-actions button{
      border:0;border-radius:8px;padding:6px 10px;cursor:pointer;
      font:800 11px Arial,"Cairo",sans-serif;white-space:nowrap;
    }
    .btn-back{background:#e9b964;color:#1a1408}
    .btn-close{background:rgba(255,255,255,.1);color:#dfe3ec;width:32px;padding:6px 0}
  </style>
</head>
<body>
  <main class="strip">
    <div class="strip-meta">
      <div class="tier" id="board-tier"></div>
      <h1 id="board-title">…</h1>
    </div>
    <div class="strip-units units" id="units-mount"></div>
    <div class="strip-actions">
      <button type="button" class="btn-back" id="back-main">كومب آخر</button>
      <button type="button" class="btn-close" id="close-board" title="إغلاق">×</button>
    </div>
  </main>
  <script src="board.js"></script>
</body>
</html>
