<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MokaTroy TFT Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="overlay-shell">
    <header class="titlebar">
      <div class="brand"><span class="brand-mark">M</span><span>MokaTroy <em>TFT</em></span></div>
      <div class="window-actions">
        <button id="minimize" aria-label="تصغير" title="تصغير">—</button>
        <button id="maximize" aria-label="تكبير" title="تكبير">□</button>
        <button id="hide" aria-label="إغلاق" title="إغلاق البرنامج">×</button>
      </div>
    </header>

    <section class="shortcut-bar">
      <span class="status-dot"></span>
      <span>رفيقك أثناء اللعب</span>
      <span id="app-version" class="version-chip">v…</span>
      <button type="button" id="check-update" class="check-update-btn" title="بحث عن تحديث">تحديث</button>
      <button type="button" id="feedback-btn" class="feedback-btn" title="إرسال ملاحظات">ملاحظات</button>
      <kbd>Ctrl + Shift + Space</kbd>
    </section>

    <section id="update-bar" class="update-bar" hidden>
      <span id="update-message"></span>
      <button id="update-action" hidden></button>
    </section>

    <section id="announce-bar" class="announce-bar" hidden>
      <span id="announce-message"></span>
      <button type="button" id="announce-dismiss" title="إخفاء">×</button>
    </section>

    <section class="search-wrap">
      <label class="sr-only" for="comp-search">ابحث عن كومب</label>
      <input id="comp-search" type="search" placeholder="ابحث عن كومب أو Champion…">
    </section>

    <nav id="comp-list" class="comp-list" aria-label="التشكيلات"></nav>

    <section id="comp-detail" class="comp-detail" aria-live="polite">
      <div class="loading">جارٍ تحميل التشكيلات…</div>
    </section>

    <footer>دليل مرجعي فقط — لا يقرأ التطبيق معلومات الجيم أو ذاكرة اللعبة.</footer>
    <div id="feedback-modal" class="modal" hidden>
    <div class="modal-card">
      <header>
        <strong>إرسال ملاحظات</strong>
        <button type="button" id="feedback-close" aria-label="إغلاق">×</button>
      </header>
      <p class="modal-hint">اكتب المشكلة أو الاقتراح. هيتفتح برنامج الإيميل لإرسال الرسالة إلى mokatroy@gmail.com، أو انسخ النص.</p>
      <textarea id="feedback-text" rows="5" placeholder="مثال: التحديث فشل، البورد غلط في كومب Invoker Ahri..."></textarea>
      <div class="modal-actions">
        <button type="button" id="feedback-copy" class="btn-ghost">نسخ النص</button>
        <button type="button" id="feedback-send" class="btn-primary">إرسال</button>
      </div>
      <p id="feedback-status" class="modal-status" hidden></p>
    </div>
  </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
